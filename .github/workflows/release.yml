name: Release

# Publishes to npm with trusted publishing (OIDC). There is no NPM_TOKEN here and there must
# never be one: npm mints a short-lived credential from GitHub's OIDC token, scoped to this
# workflow in this repository. A long-lived publish token in a secret is what this replaces,
# and npm retires bypass-2FA token publishing in January 2027 regardless.
#
# One-time setup on npmjs.com, without which every run fails at the publish step:
#   Package settings -> Trusted Publisher -> GitHub Actions
#     Repository: sam-rubinstein/frontend-design-mcp
#     Workflow:   release.yml
#
# To cut a release: bump `version` in package.json and the three plugin manifests together
# (test/plugin.test.ts fails if they drift), commit, then push a matching tag:
#   git tag v0.1.1 && git push origin v0.1.1

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Never cancel a publish already in flight - a half-run release job is worse than a queued one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # mints the OIDC token npm exchanges for publish rights

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # npm's own guidance for release builds: a cache hit is one more place a tampered
          # dependency could enter the artifact that gets signed.
          package-manager-cache: false

      - name: npm is new enough to speak OIDC
        run: |
          required=11.5.1
          actual=$(npm --version)
          if [ "$(printf '%s\n%s\n' "$required" "$actual" | sort -V | head -n1)" != "$required" ]; then
            echo "Trusted publishing needs npm >=$required; this runner has $actual." >&2
            echo "Bump node-version in this workflow, or add a global npm install step." >&2
            exit 1
          fi
          echo "npm $actual"

      - run: npm ci

      # The whole PR gate again. CI passing on some commit is not evidence that the tag points at
      # that commit, and this is the last moment before the artifact is public and immutable.
      - name: Biome (lint + format check)
        run: npx biome ci .

      - run: npx tsc --noEmit

      - run: npm test

      # Build on 24, the same as CI: TypeScript itself is not held to the engines floor, only the
      # output is. The runtime check below is what enforces the promise `engines` makes.
      - run: npm run build

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 18

      - name: Built output runs on the oldest supported runtime
        run: node scripts/compat-check.mjs

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # A tag that disagrees with package.json publishes a version nobody can find by tag.
      # Only meaningful for tag pushes; a manual dispatch publishes whatever package.json says.
      - name: Tag matches the version being published
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged=${GITHUB_REF_NAME#v}
          declared=$(node -p "require('./package.json').version")
          if [ "$tagged" != "$declared" ]; then
            echo "Tag $GITHUB_REF_NAME says $tagged but package.json says $declared." >&2
            exit 1
          fi
          echo "publishing $declared"

      # No --provenance flag: trusted publishing generates and publishes the attestation itself.
      # No NODE_AUTH_TOKEN: setup-node plus id-token:write completes the OIDC handshake.
      - run: npm publish

      # The plugins install this package by spec, so the thing worth checking is that the spec
      # resolves and the server answers - not that a local build did.
      - name: Published package starts over stdio
        run: |
          published=$(node -p "require('./package.json').version")
          cd "$(mktemp -d)"
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"release-check","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' > in.jsonl
          npx -y "frontend-design-mcp@$published" < in.jsonl > out.jsonl
          node -e '
            const lines = require("fs").readFileSync("out.jsonl", "utf8")
              .trim().split("\n").filter(Boolean).map(JSON.parse);
            const tools = lines.find((l) => l.id === 2)?.result?.tools ?? [];
            if (tools.length !== 8) {
              console.error(`expected 8 tools from the published package, got ${tools.length}`);
              process.exit(1);
            }
            console.log("published server advertises:", tools.map((t) => t.name).sort().join(", "));
          '
