name: Release

# Publishes to npm with trusted publishing (OIDC). There is no NPM_TOKEN here and there must
# never be one: npm mints a short-lived credential from GitHub's OIDC token, scoped to this
# workflow, in this repository, running in the `npm-publish` environment. A long-lived publish
# token in a secret is what this replaces, and npm retires bypass-2FA token publishing in
# January 2027 regardless.
#
# Setup, in this order. Getting it wrong fails the run with an opaque OIDC or environment error.
#
#   1. GitHub -> Settings -> Environments -> New environment -> `npm-publish`
#      In it: Deployment branches and tags -> Selected -> add rule, type Tag, pattern `v*`.
#      Without that rule the environment gates nothing: a workflow_dispatch from any branch
#      could still publish. Tag rules match tags only, and have worked since October 2023 -
#      older threads saying tag-triggered deploys cannot use environments are out of date.
#
#   2. npmjs.com -> package Settings -> Trusted Publisher -> GitHub Actions
#        Organization or user: sam-rubinstein
#        Repository:           frontend-design-mcp
#        Workflow filename:    release.yml
#        Environment name:     npm-publish        (must match step 1 exactly)
#        Allowed actions:      tick `npm publish` as well as `npm stage publish`
#
#      That last field matters. Trusted publishers created after 3 September 2026 default to
#      stage-only, and the `npm publish` below is rejected unless direct publishing is allowed.
#
# To cut a release, bump the version everywhere it is written down - package.json, the two
# marketplace catalogs that carry one, the three plugin manifests, the exact npm spec in
# plugins/frontend-design/.mcp.json, and the serverInfo literal in src/server.ts. test/plugin.test.ts
# fails on any of them drifting. Then commit and push a matching tag:
#   git tag v0.1.1 && git push origin v0.1.1

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Never cancel a publish already in flight - a half-run release job is worse than a queued one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # mints the OIDC token npm exchanges for publish rights

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Gated by the environment's tag rule, and named in npm's trusted-publisher config so
    # the OIDC claim only matches runs that passed that gate.
    environment: npm-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # npm's own guidance for release builds: a cache hit is one more place a tampered
          # dependency could enter the artifact that gets signed.
          package-manager-cache: false

      - name: npm is new enough to speak OIDC
        run: |
          required=11.5.1
          actual=$(npm --version)
          if [ "$(printf '%s\n%s\n' "$required" "$actual" | sort -V | head -n1)" != "$required" ]; then
            echo "Trusted publishing needs npm >=$required; this runner has $actual." >&2
            echo "Bump node-version in this workflow, or add a global npm install step." >&2
            exit 1
          fi
          echo "npm $actual"

      - run: npm ci

      # The whole PR gate again. CI passing on some commit is not evidence that the tag points at
      # that commit, and this is the last moment before the artifact is public and immutable.
      - name: Biome (lint + format check)
        run: npx biome ci .

      - run: npx tsc --noEmit

      - run: npm test

      # Build on 24, the same as CI: TypeScript itself is not held to the engines floor, only the
      # output is. The runtime check below is what enforces the promise `engines` makes.
      - run: npm run build

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 18

      - name: Built output runs on the oldest supported runtime
        run: node scripts/compat-check.mjs

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # A tag that disagrees with package.json publishes a version nobody can find by tag.
      # Only meaningful for tag pushes; a manual dispatch publishes whatever package.json says.
      - name: Tag matches the version being published
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged=${GITHUB_REF_NAME#v}
          declared=$(node -p "require('./package.json').version")
          if [ "$tagged" != "$declared" ]; then
            echo "Tag $GITHUB_REF_NAME says $tagged but package.json says $declared." >&2
            exit 1
          fi
          echo "publishing $declared"

      # No --provenance flag: trusted publishing generates and publishes the attestation itself.
      # No NODE_AUTH_TOKEN: setup-node plus id-token:write completes the OIDC handshake.
      - run: npm publish

      # A published version is not installable straight away. npm scans every publish for malware
      # first, and npm's guidance is explicit: "This introduces a short delay between publishing and
      # availability, typically around five minutes. It may take longer, up to 15 minutes or more,
      # at peak times [...] If you have automation that assumes a package is installable immediately
      # after publishing, update it to tolerate a short availability delay."
      # https://github.blog/changelog/2026-07-28-npm-publish-time-malware-scanning-and-dual-use-metadata/
      #
      # The 0.1.1 release is what this is written from: the publish landed at 16:37:20.358Z and the
      # npx below ran at 16:37:21.358Z, one second later, failing with `ETARGET No matching version
      # found` for a version that had just been published and was fine minutes afterwards.
      #
      # 20 minutes, not the five the delay "typically" takes: the whole point is to outlast a peak.
      # Timing out here means the publish went through but nobody can install it - worth a red run.
      - name: Wait for the published version to become installable
        run: |
          published=$(node -p "require('./package.json').version")
          for attempt in $(seq 1 120); do
            if npm view "frontend-design-mcp@$published" version --prefer-online >/dev/null 2>&1; then
              echo "$published resolves after $(( attempt * 10 ))s"
              exit 0
            fi
            sleep 10
          done
          echo "frontend-design-mcp@$published was published but still does not resolve after 20 minutes." >&2
          echo "Check https://www.npmjs.com/package/frontend-design-mcp before re-running." >&2
          exit 1

      # The plugins install this package by spec, so the thing worth checking is that the spec
      # resolves and the server answers - not that a local build did.
      - name: Published package starts over stdio
        env:
          # The lookup above already warmed the packument, but do not let a cache entry written
          # while the version was still missing decide whether this release passes.
          npm_config_prefer_online: "true"
        run: |
          published=$(node -p "require('./package.json').version")
          cd "$(mktemp -d)"
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"release-check","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' > in.jsonl
          npx -y "frontend-design-mcp@$published" < in.jsonl > out.jsonl
          PUBLISHED="$published" node -e '
            const lines = require("fs").readFileSync("out.jsonl", "utf8")
              .trim().split("\n").filter(Boolean).map(JSON.parse);
            const tools = lines.find((l) => l.id === 2)?.result?.tools ?? [];
            if (tools.length !== 8) {
              console.error(`expected 8 tools from the published package, got ${tools.length}`);
              process.exit(1);
            }
            // 0.1.0 shipped announcing 0.1.0 from a literal that nobody had bumped since. The
            // test suite guards that literal now; this is the same check against the artifact
            // a user actually installs.
            const advertised = lines.find((l) => l.id === 1)?.result?.serverInfo?.version;
            if (advertised !== process.env.PUBLISHED) {
              console.error(`published ${process.env.PUBLISHED} but it announces ${advertised}`);
              process.exit(1);
            }
            console.log("published server advertises:", tools.map((t) => t.name).sort().join(", "));
          '
