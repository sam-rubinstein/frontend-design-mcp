name: Live catalog contract

# The three upstream catalogs publish no API contract, so these tests are the only warning that
# a response shape or endpoint changed. They are deliberately kept off the PR path: an outage at
# getdesign.md must not block an unrelated merge.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Live contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Contract tests against the real catalogs
        run: npm run test:live
      - name: End-to-end over stdio
        run: npm run smoke
